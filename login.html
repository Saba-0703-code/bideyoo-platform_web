<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Pressing Bidè</title>
  <meta name="description" content="Connectez-vous à votre espace client Pressing Bidè pour suivre vos commandes et gérer votre profil.">
  <link rel="icon" type="image/jpeg" href="assets/logo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <style>
    .login-tab-nav {
      display: flex; gap: 0; margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--pb-border);
    }
    .login-tab-btn {
      flex: 1; padding: .75rem 1rem; font-weight: 700; font-size: .9rem;
      text-align: center; border: none; background: none; color: var(--pb-muted);
      cursor: pointer; transition: all .2s; position: relative;
    }
    .login-tab-btn::after {
      content: ""; position: absolute; bottom: -2px; left: 0; right: 0;
      height: 3px; border-radius: 2px; background: transparent; transition: all .2s;
    }
    .login-tab-btn.active { color: var(--pb-primary); }
    .login-tab-btn.active::after { background: var(--pb-primary); }
    .login-tab-btn.user-tab.active { color: var(--pb-primary); }
    .login-tab-btn.user-tab.active::after { background: var(--pb-primary); }
    .login-tab-btn.admin-tab.active { color: var(--pb-dark); }
    .login-tab-btn.admin-tab.active::after { background: var(--pb-dark); }
    .login-tab-btn .tab-icon { font-size: 1.3rem; display: block; margin-bottom: .2rem; }
    .login-section { display: none; }
    .login-section.active { display: block; }
    .admin-hint {
      background: linear-gradient(135deg, #2D3436 0%, #1a1a2e 100%);
      color: #fff; border-radius: .75rem; padding: .75rem 1rem; margin-top: 1rem;
      font-size: .8rem;
    }
    .admin-hint i { color: var(--pb-accent); }
    .admin-badge-login {
      background: var(--pb-dark); color: #fff; padding: .3rem .7rem;
      border-radius: 1rem; font-size: .7rem; font-weight: 700;
      display: inline-flex; align-items: center; gap: .3rem;
    }
  </style>
</head>
<body class="bg-pb-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card auth-card">
          <div class="card-body">
            <!-- Brand -->
            <div class="auth-brand">
              <img src="assets/logo.jpeg" alt="Logo" width="48" height="48" style="object-fit:contain;">
              <span>Pressing <span class="text-pb">Bidè</span></span>
            </div>

            <!-- Onglets Utilisateur / Admin -->
            <div class="login-tab-nav">
              <button class="login-tab-btn user-tab active" data-tab="user-login" type="button">
                <span class="tab-icon"><i class="bi bi-person"></i></span>
                Utilisateur
              </button>
              <button class="login-tab-btn admin-tab" data-tab="admin-login" type="button">
                <span class="tab-icon"><i class="bi bi-shield-lock"></i></span>
                Administrateur
              </button>
            </div>

            <!-- ===== FORMULAIRE UTILISATEUR ===== -->
            <div class="login-section active" id="user-login">
              <form id="login-form" novalidate>
                <div class="mb-3">
                  <label for="lg-email" class="form-label">Adresse e-mail</label>
                  <input type="email" class="form-control" id="lg-email" placeholder="vous@exemple.com" autocomplete="email" required>
                  <div class="invalid-feedback">Adresse e-mail invalide.</div>
                </div>
                <div class="mb-3">
                  <label for="lg-password" class="form-label">Mot de passe</label>
                  <div class="input-group">
                    <input type="password" class="form-control" id="lg-password" autocomplete="current-password" required>
                    <button class="btn btn-outline-secondary" type="button" id="toggle-password"><i class="bi bi-eye"></i></button>
                  </div>
                  <div class="invalid-feedback">Mot de passe requis (6 caractères minimum).</div>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember-me">
                    <label class="form-check-label small" for="remember-me">Se souvenir de moi</label>
                  </div>
                  <a href="#" class="small text-pb" id="forgot-password">Mot de passe oublié ?</a>
                </div>
                <button type="submit" class="btn btn-pb w-100 mb-3">
                  <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
                </button>
                <p class="small text-muted text-center mb-0">
                  Pas encore de compte ? <a href="register.html" class="text-pb fw-bold">Créez-en un</a>
                </p>
              </form>
            </div>

            <!-- ===== FORMULAIRE ADMINISTRATEUR ===== -->
            <div class="login-section" id="admin-login">
              <div class="d-flex align-items-center gap-2 mb-3">
                <span class="admin-badge-login"><i class="bi bi-shield-lock"></i> Admin</span>
              </div>
              <form id="admin-login-form" novalidate>
                <div class="mb-3">
                  <label for="adm-email" class="form-label">E-mail administrateur</label>
                  <input type="email" class="form-control" id="adm-email" placeholder="adminplace@gmail.com" autocomplete="email" required>
                  <div class="invalid-feedback">Adresse e-mail invalide.</div>
                </div>
                <div class="mb-3">
                  <label for="adm-password" class="form-label">Mot de passe</label>
                  <div class="input-group">
                    <input type="password" class="form-control" id="adm-password" autocomplete="current-password" required>
                    <button class="btn btn-outline-secondary" type="button" id="toggle-adm-password"><i class="bi bi-eye"></i></button>
                  </div>
                  <div class="invalid-feedback">Mot de passe requis (6 caractères minimum).</div>
                </div>
                <button type="submit" class="btn w-100 mb-3" style="background:var(--pb-dark);color:#fff;font-weight:700;">
                  <i class="bi bi-shield-lock me-2"></i>Accéder à l'administration
                </button>
              </form>
            </div>

          </div>
        </div>
        <p class="text-center small text-muted mt-3"><a href="index.html" class="text-pb"><i class="bi bi-arrow-left me-1"></i>Retour à l'accueil</a></p>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container" style="z-index:1080;"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Basculement Utilisateur / Admin
      document.querySelectorAll(".login-tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".login-tab-btn").forEach(b => b.classList.remove("active"));
          document.querySelectorAll(".login-section").forEach(s => s.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById(btn.dataset.tab).classList.add("active");
        });
      });

      // Toggle mot de passe admin
      const toggleAdm = document.getElementById("toggle-adm-password");
      if (toggleAdm) {
        toggleAdm.addEventListener("click", () => {
          const input = document.getElementById("adm-password");
          const icon = toggleAdm.querySelector("i");
          if (input.type === "password") {
            input.type = "text";
            icon.classList.replace("bi-eye", "bi-eye-slash");
          } else {
            input.type = "password";
            icon.classList.replace("bi-eye-slash", "bi-eye");
          }
        });
      }

      // Formulaire admin
      const adminForm = document.getElementById("admin-login-form");
      if (adminForm) {
        adminForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const email = document.getElementById("adm-email");
          const password = document.getElementById("adm-password");

          const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
          const passValid = password.value.length >= 6;

          email.classList.toggle("is-invalid", !emailValid);
          password.classList.toggle("is-invalid", !passValid);

          if (!emailValid || !passValid) {
            pbToast("Veuillez corriger les erreurs.", "error");
            return;
          }

          // Vérifier le compte admin dans localStorage
          const users = JSON.parse(localStorage.getItem("pb_users") || "[]");
          const user = users.find(u => u.email === email.value.trim().toLowerCase());

          if (!user) {
            email.classList.add("is-invalid");
            pbToast("Aucun compte trouvé avec cet e-mail.", "error");
            return;
          }

          if (user.password !== pbHashPassword(password.value)) {
            password.classList.add("is-invalid");
            pbToast("Mot de passe incorrect.", "error");
            return;
          }

          // Vérifier que c'est bien un admin
          if (user.role !== "admin") {
            pbToast("Ce compte n'est pas un compte administrateur. Utilisez un e-mail admin.", "error");
            return;
          }

          // Créer la session
          const sessionData = {
            userId: user.id,
            name: user.name,
            email: user.email,
            phone: user.phone,
            accountType: user.accountType,
            role: user.role,
            loyaltyPoints: user.loyaltyPoints || 0,
            lastActivity: Date.now(),
          };
          localStorage.setItem("pb_session", JSON.stringify(sessionData));

          pbToast("Connexion admin réussie ! Redirection…");
          setTimeout(() => { window.location.href = "admin.html"; }, 1200);
        });
      }
    });
  </script>
</body>
</html>
