<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nos agences — Pressing Bidè</title>
  <meta name="description" content="Trouvez l'agence Pressing Bidè la plus proche de vous. Carte interactive, horaires et disponibilité en temps réel.">
  <link rel="icon" type="image/jpeg" href="assets/logo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg sticky-top bdy-navbar" id="bdy-navbar" aria-label="Navigation principale"></nav>

  <!-- ================= ENTÊTE ================= -->

  <header class="bg-pb-light border-bottom border-light-subtle">
    <div class="container py-5">
      <span class="bdy-eyebrow">Nos agences</span>
      <h1 class="bdy-section-title mb-2">Retrouvez-nous près de chez vous</h1>
      <p class="bdy-section-sub mb-0">Plusieurs points de vente à travers le Togo. Trouvez l'agence la plus proche.</p>
    </div>
  </header>

  <!-- ================= CARTE + LISTE ================= -->

  <section class="bdy-section">
    <div class="container">
      <div class="row g-4">
        
        <!-- Carte -->

        <div class="col-lg-7">
          <div class="card h-100">
            <div class="card-body p-0 overflow-hidden rounded-4">
              <iframe class="map" title="Carte des agences Pressing Bidè"
                src="https://www.openstreetmap.org/export/embed.html?bbox=0.5%2C6.0%2C2.5%2C10.5&layer=mapnik&marker=6.1319%2C1.2228"
                loading="lazy" allowfullscreen></iframe>
            </div>
          </div>
        </div>

        <!-- Liste des agences -->

        <div class="col-lg-5">
          <div id="locations-list">

            <!-- Injecté par JS -->

          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= BARRE DE RECHERCHE ================= -->

  <section class="bdy-section bg-white border-top border-bottom border-light-subtle">
    <div class="container">
      <div class="text-center mb-4">
        <span class="bdy-eyebrow">Recherche</span>
        <h2 class="bdy-section-title">Trouvez votre point de vente</h2>
      </div>
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="search-box">
            <i class="bi bi-search search-icon"></i>
            <input type="text" class="form-control form-control-lg" id="location-search" placeholder="Rechercher par ville, quartier ou nom d'agence…">
          </div>
        </div>
      </div>
      <div class="row g-4 mt-3" id="search-results">

        <!-- Résultats injectés par JS -->

      </div>
    </div>
  </section>

  <footer class="bdy-footer" id="bdy-footer"></footer>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container" style="z-index:1080;"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/services-data.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const listEl = document.getElementById("locations-list");
      if (!listEl) return;

      listEl.innerHTML = PB_LOCATIONS.map(loc => `
        <div class="card location-card mb-3">
          <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <h3 class="h6 fw-bold mb-0">${loc.name}</h3>
              <span class="status-dot ${loc.isOpen ? 'open' : 'closed'}" title="${loc.isOpen ? 'Ouvert' : 'Fermé'}"></span>
            </div>
            <p class="text-muted small mb-2"><i class="bi bi-geo-alt me-1"></i>${loc.address}</p>
            <p class="text-muted small mb-2"><i class="bi bi-clock me-1"></i>${loc.hours}</p>
            <p class="text-muted small mb-2"><i class="bi bi-telephone me-1"></i><a href="tel:${loc.phone.replace(/\s/g, '')}">${loc.phone}</a></p>
            <div class="d-flex flex-wrap gap-1 mt-2">
              ${loc.services.map(s => `<span class="badge bg-pb-light text-pb">${s}</span>`).join('')}
            </div>
            <span class="badge ${loc.isOpen ? 'bg-success' : 'bg-danger'} mt-2">${loc.isOpen ? 'Ouvert' : 'Fermé'}</span>
          </div>
        </div>
      `).join('');

      // Recherche
      const searchInput = document.getElementById("location-search");
      const searchResults = document.getElementById("search-results");
      if (searchInput) {
        searchInput.addEventListener("input", () => {
          const q = searchInput.value.toLowerCase().trim();
          if (!q) { searchResults.innerHTML = ''; return; }
          const matches = PB_LOCATIONS.filter(l =>
            l.name.toLowerCase().includes(q) ||
            l.address.toLowerCase().includes(q) ||
            l.services.some(s => s.toLowerCase().includes(q))
          );
          searchResults.innerHTML = matches.length
            ? matches.map(loc => `
              <div class="col-md-6">
                <div class="card card-hover h-100">
                  <div class="card-body p-4">
                    <h3 class="h6 fw-bold">${loc.name}</h3>
                    <p class="text-muted small mb-1"><i class="bi bi-geo-alt me-1"></i>${loc.address}</p>
                    <p class="text-muted small mb-0"><i class="bi bi-clock me-1"></i>${loc.hours}</p>
                  </div>
                </div>
              </div>`).join('')
            : '<div class="col-12 text-center text-muted py-4">Aucune agence trouvée pour cette recherche.</div>';
        });
      }
    });
  </script>
</body>
</html>
